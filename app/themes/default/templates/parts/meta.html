<p class="entry-meta">
  <time datetime="{{date .PublishedAt "2006-01-02T15:04:05Z07:00"}}">{{date .PublishedAt}}</time>
  {{- with .Authors}} · {{range $i, $a := .}}{{if $i}}, {{end}}<a href="{{url $a}}" rel="author">{{$a.Name}}</a>{{end}}{{end}}
  {{- if and (eq .Type "post") (theme_setting "show_reading_time")}} · {{reading_time .}} {{t "min_read"}}{{end}}
</p>
